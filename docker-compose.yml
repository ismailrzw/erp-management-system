services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbl_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=development
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - mongo
    networks:
      - pbl_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pbl_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - pbl_network

  mongo:
    image: mongo:7
    container_name: pbl_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpass
      MONGO_INITDB_DATABASE: pbl_system
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pbl_network

volumes:
  mongo_data:

networks:
  pbl_network:
    driver: bridge