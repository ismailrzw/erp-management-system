version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: pbl_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: pbl_system
    volumes:
      - mongo_data:/data/db
    networks:
      - pbl_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pbl_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGO_URI=mongodb://admin:secret@mongodb:27017/pbl_system?authSource=admin
      - SECRET_KEY=dev_secret_key_change_me
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - pbl_network

volumes:
  mongo_data:

networks:
  pbl_network:
    driver: bridge