<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PBL Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0073aa;
  --primary-hover:#0095dd;
  --success:#54d98c;
  --warning:#f4d03f;
  --danger:#ed7669;
  --info:#5faee3;
  --page-bg:#f3f3f3;
  --card-bg:#ffffff;
  --heading:#4a6076;
  --body-text:#757575;
  --muted:#9f9f9f;
  --dark-text:#2c3e50;
  --border:#dddddd;
  --sidebar-w:235px;
  --navbar-h:60px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Mada',sans-serif;
  background:var(--page-bg);
  color:var(--body-text);
  font-size:14px;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{margin:0;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}

/* ---------- Preloader ---------- */
#preloader{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}
#preloader.hide{opacity:0;pointer-events:none;}
.ball-scale{display:flex;gap:8px;}
.ball-scale div{width:14px;height:14px;border-radius:50%;background:var(--primary);animation:ballScale 1s ease-in-out infinite;}
.ball-scale div:nth-child(2){animation-delay:.15s;background:var(--info);}
.ball-scale div:nth-child(3){animation-delay:.3s;background:var(--success);}
@keyframes ballScale{0%,100%{transform:scale(.3);opacity:.4;}50%{transform:scale(1);opacity:1;}}

/* ---------- Login ---------- */
.login-wrap{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef4f8 0%,#f3f3f3 60%);padding:20px;}
.login-card{background:var(--card-bg);width:380px;max-width:100%;border-radius:4px;border-top:4px solid var(--primary);box-shadow:0 4px 20px rgba(0,0,0,.08);padding:36px 32px 28px;}
.login-card h4{font-size:22px;font-weight:600;color:var(--heading);text-align:center;margin-bottom:6px;}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
.login-error{background:#fdecea;color:var(--danger);border:1px solid #f5c6c0;padding:8px 12px;border-radius:3px;font-size:13px;margin-bottom:14px;display:none;}
.login-error.show{display:block;}
.login-logo{width:46px;height:46px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin:0 auto 14px;}
.login-foot-logo{text-align:center;margin-top:22px;color:var(--muted);font-size:12px;letter-spacing:.5px;}
.demo-box{margin-top:18px;background:#f7fafc;border:1px dashed var(--border);border-radius:4px;padding:10px 12px;font-size:12px;color:var(--muted);}
.demo-box b{color:var(--dark-text);}
.demo-row{display:flex;justify-content:space-between;padding:2px 0;cursor:pointer;}
.demo-row:hover{color:var(--primary);}

/* ---------- Form elements ---------- */
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--dark-text);margin-bottom:5px;}
.form-control{width:100%;border:1px solid var(--border);border-radius:3px;padding:9px 12px;color:var(--dark-text);background:#fff;outline:none;transition:border-color .15s;}
.form-control:focus{border-color:var(--primary);}
.form-control:disabled{background:#f5f5f5;color:var(--muted);}
.form-row{display:flex;gap:14px;flex-wrap:wrap;}
.form-row>.form-group{flex:1;min-width:180px;}
.form-hint{font-size:12px;color:var(--muted);margin-top:4px;}
.form-error-text{font-size:12px;color:var(--danger);margin-top:4px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dark-text);}
.checkbox-row input{width:15px;height:15px;}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:3px;padding:9px 18px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden;transition:background .15s,box-shadow .15s;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-success{background:var(--success);color:#fff;}
.btn-success:hover{filter:brightness(0.95);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(0.95);}
.btn-info{background:var(--info);color:#fff;border-radius:20px;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--dark-text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;}
.btn-link{background:none;color:var(--primary);padding:4px 6px;font-weight:600;}
.icon-btn{background:none;border:none;color:var(--muted);padding:4px;border-radius:3px;display:inline-flex;}
.icon-btn:hover{background:#f0f0f0;color:var(--dark-text);}

/* ---------- App Layout ---------- */
#app-shell{display:none;}
.navbar{position:fixed;top:0;left:0;right:0;height:var(--navbar-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:500;}
.navbar-left{display:flex;align-items:center;gap:14px;}
.navbar-logo{width:var(--sidebar-w);display:flex;align-items:center;gap:10px;margin-left:-18px;padding-left:18px;height:var(--navbar-h);background:#1f2d3a;color:#fff;transition:width .18s ease;overflow:hidden;}
.navbar-logo .mark{width:30px;height:30px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.navbar-logo .txt{font-weight:600;font-size:14px;letter-spacing:.3px;}
.navbar-right{display:flex;align-items:center;gap:6px;}
.role-chip{background:#eef6fb;color:var(--primary);font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;margin-right:8px;}
.user-menu{position:relative;}
.user-btn{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;border:none;background:none;}
.user-btn:hover{background:#f5f5f5;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;}
.user-name{font-size:13px;color:var(--dark-text);font-weight:500;}
.dropdown{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 6px 20px rgba(0,0,0,.12);width:190px;display:none;overflow:hidden;z-index:600;}
.dropdown.open{display:block;}
.dropdown a,.dropdown button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 14px;font-size:13px;background:none;border:none;color:var(--dark-text);}
.dropdown a:hover,.dropdown button:hover{background:#f5f5f5;color:var(--primary);}

.sidebar-toggle-btn{flex-shrink:0;}
.sidebar{position:fixed;top:var(--navbar-h);left:0;bottom:0;width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;z-index:400;transition:transform .2s ease,width .18s ease;padding-bottom:30px;}
.nav-section{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:16px 18px 6px;}
.nav-item,.nav-menu-btn{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13.5px;color:var(--dark-text);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-weight:500;}
.nav-item:hover,.nav-menu-btn:hover{background:#f5f9fb;color:var(--primary);}
.nav-item.active{background:#eaf5fb;color:var(--primary);border-right:3px solid var(--primary);font-weight:600;}
.nav-menu-btn .chev{margin-left:auto;transition:transform .15s;}
.nav-menu-btn.open .chev{transform:rotate(90deg);}
.nav-sub{display:none;flex-direction:column;background:#fafbfc;}
.nav-sub.open{display:flex;}
.nav-sub-item{padding:9px 18px 9px 46px;font-size:13px;color:var(--body-text);cursor:pointer;border:none;background:none;text-align:left;width:100%;}
.nav-sub-item:hover{color:var(--primary);}
.nav-sub-item.active{color:var(--primary);font-weight:600;background:#eaf5fb;}
.nav-icon{width:17px;height:17px;flex-shrink:0;}

.content-wrap{margin-left:var(--sidebar-w);margin-top:var(--navbar-h);padding:1.8rem;min-height:calc(100vh - var(--navbar-h));transition:margin-left .18s ease;}
.hamburger{display:none;}
.sidebar-overlay{display:none;}

/* ---- Desktop: user-toggleable collapsed (icon-only) sidebar ---- */
@media(min-width:901px){
  .sidebar-toggle-btn{display:inline-flex;}
  #app-shell.collapsed .sidebar{width:64px;}
  #app-shell.collapsed .content-wrap{margin-left:64px;}
  #app-shell.collapsed .navbar-logo{width:64px;}
  #app-shell.collapsed .navbar-logo .txt{display:none;}
  #app-shell.collapsed .nav-section{display:none;}
  #app-shell.collapsed .nav-sub{display:none !important;}
  #app-shell.collapsed .nav-item,#app-shell.collapsed .nav-menu-btn{justify-content:center;padding:10px 0;gap:0;}
  #app-shell.collapsed .nav-item span,#app-shell.collapsed .nav-menu-btn span,#app-shell.collapsed .nav-menu-btn svg:last-of-type{display:none;}
  #app-shell.collapsed .nav-item.active{border-right:none;box-shadow:inset 3px 0 0 var(--primary);}
}
@media(max-width:900px){
  .sidebar-toggle-btn{display:none;}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);width:min(var(--sidebar-w),82vw);}
  .sidebar.mobile-open{transform:translateX(0);box-shadow:0 0 24px rgba(0,0,0,.2);}
  .sidebar-overlay.show{display:block;position:fixed;top:var(--navbar-h);left:0;right:0;bottom:0;background:rgba(20,28,36,.35);z-index:390;}
  .content-wrap{margin-left:0;padding:1rem;}
  .navbar-logo{width:auto;}
  .hamburger{display:flex;}
  .navbar-logo .txt{display:none;}
  .navbar{padding:0 12px;}
  .role-chip{display:none;}
}
@media(max-width:600px){
  .content-wrap{padding:.85rem;}
  .user-name{display:none;}
  .user-btn{padding:6px;}
  .navbar-right{gap:2px;}
  .toolbar{gap:8px;}
  .search-input{max-width:none;width:100%;flex:1 1 100%;}
  .filters{width:100%;}
  .filters select{flex:1;min-width:0;}
  .page-header{align-items:flex-start;}
  .modal-box{width:100%;}
  .stat-card{padding:16px;}
  .step-track{overflow-x:auto;padding-bottom:4px;}
}
@media(max-width:420px){
  .login-card{padding:28px 20px 22px;}
  .form-row{flex-direction:column;}
  .toast{min-width:0;width:calc(100vw - 36px);}
  #toast-wrap{left:18px;right:18px;}
}

/* ---------- Page header ---------- */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.page-header h4{font-size:20px;font-weight:600;color:var(--heading);}
.breadcrumb{font-size:13px;color:var(--muted);}
.breadcrumb span{color:var(--heading);}
.breadcrumb .sep{margin:0 6px;color:#c8c8c8;}

/* ---------- Cards ---------- */
.card{background:var(--card-bg);border-radius:2px;box-shadow:0 2px 1px rgba(0,0,0,.05);margin-bottom:24px;border-top:4px solid transparent;}
.card.b-primary{border-top-color:rgba(0,115,170,.5);}
.card.b-success{border-top-color:var(--success);}
.card.b-warning{border-top-color:var(--warning);}
.card.b-danger{border-top-color:var(--danger);}
.card.b-info{border-top-color:var(--info);}
.card-block{padding:1.25rem;}
.card-title{font-size:15px;font-weight:600;color:var(--body-text);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:6px;}
@media(max-width:1100px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.stat-grid{grid-template-columns:1fr;}}
.stat-card{background:#fff;border-radius:2px;border-top:4px solid var(--primary);box-shadow:0 2px 1px rgba(0,0,0,.05);padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
.stat-card.success{border-top-color:var(--success);}
.stat-card.warning{border-top-color:var(--warning);}
.stat-card.info{border-top-color:var(--info);}
.stat-num{font-size:28px;font-weight:700;color:var(--dark-text);line-height:1;}
.stat-label{font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:500;}
.stat-icon{width:42px;height:42px;border-radius:10px;background:#eaf5fb;color:var(--primary);display:flex;align-items:center;justify-content:center;}
.stat-card.success .stat-icon{background:#e6fbf0;color:var(--success);}
.stat-card.warning .stat-icon{background:#fef9e6;color:#b8960c;}
.stat-card.info .stat-icon{background:#eaf5fb;color:var(--info);}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;}
table.dtable{width:100%;border-collapse:collapse;border:1px solid var(--border);font-size:13px;}
table.dtable th{border-bottom:2px solid #ccc;font-weight:600;text-align:left;padding:.75rem;color:var(--dark-text);background:#fafbfc;white-space:nowrap;}
table.dtable td{padding:.75rem;border:1px solid var(--border);color:var(--body-text);vertical-align:middle;}
table.dtable tr:hover td{background:#f9fcfe;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.search-input{position:relative;flex:1;min-width:160px;max-width:220px;}
.search-input input{padding-left:32px;width:100%;}
.search-input svg{position:absolute;left:9px;top:9px;color:var(--muted);}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:3px;background:#fff;font-size:13px;}
.pagination{display:flex;gap:4px;justify-content:flex-end;margin-top:14px;}
.pagination button{border:1px solid var(--border);background:#fff;padding:5px 11px;border-radius:3px;font-size:12px;color:var(--dark-text);}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary);}

/* ---------- Badge / Alert ---------- */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px;}
.badge-success{background:#e6fbf0;color:#1e9b5c;}
.badge-warning{background:#fef9e6;color:#a37c00;}
.badge-danger{background:#fdecea;color:var(--danger);}
.badge-info{background:#eaf5fb;color:var(--primary);}
.badge-muted{background:#f0f0f0;color:var(--muted);}
.alert{padding:10px 14px;border-radius:3px;font-size:13px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;}
.alert-warning{background:#fff9e6;color:#8a6d00;border:1px solid #f4e6a8;}
.alert-info{background:#eaf5fb;color:#1a6a90;border:1px solid #cfe8f5;}
.alert-danger{background:#fdecea;color:#b23325;border:1px solid #f5c6c0;}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed;top:74px;right:18px;z-index:9000;display:flex;flex-direction:column;gap:8px;}
.toast{min-width:260px;background:#2c3e50;color:#fff;padding:12px 16px;border-radius:4px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:8px;animation:toastIn .25s ease;border-left:4px solid var(--success);}
.toast.err{border-left-color:var(--danger);}
.toast.info{border-left-color:var(--info);}
@keyframes toastIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(30,40,50,.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:5px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.25);}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h5{font-size:16px;font-weight:600;color:var(--heading);}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.close-x{background:none;border:none;color:var(--muted);font-size:20px;line-height:1;padding:2px;}
.close-x:hover{color:var(--danger);}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:18px;gap:4px;}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;position:relative;}
.tab-btn.active{color:var(--primary);}
.tab-btn.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--primary);border-radius:2px 2px 0 0;}
.confirm-box{width:380px;max-width:100%;}
.confirm-icon{width:44px;height:44px;border-radius:50%;background:#fdecea;color:var(--danger);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}

/* ---------- Misc ---------- */
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state svg{margin-bottom:10px;color:#cfcfcf;}
.empty-state .t{font-weight:600;color:var(--dark-text);font-size:14px;margin-bottom:4px;}
.skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:4px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
.skeleton-row{height:38px;margin-bottom:8px;}
.rich-toolbar{display:flex;gap:4px;border:1px solid var(--border);border-bottom:none;border-radius:3px 3px 0 0;padding:6px;background:#fafbfc;}
.rich-toolbar button{border:none;background:#fff;border:1px solid var(--border);width:28px;height:28px;border-radius:3px;font-size:12px;color:var(--dark-text);font-weight:700;}
.rich-editor{border:1px solid var(--border);border-radius:0 0 3px 3px;min-height:110px;padding:10px 12px;color:var(--dark-text);outline:none;}
.dropzone{border:2px dashed var(--border);border-radius:6px;padding:34px 16px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;}
.dropzone:hover,.dropzone.drag{border-color:var(--info);background:#f5fbff;}
.dropzone svg{margin-bottom:8px;color:var(--info);}
.file-chip{display:flex;align-items:center;justify-content:space-between;background:#f5f9fb;border:1px solid var(--border);border-radius:4px;padding:8px 12px;font-size:13px;margin-top:10px;}
.progress-bar{height:6px;background:#eee;border-radius:6px;overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;background:var(--success);width:0%;transition:width .4s;}
.rubric-block{border:1px solid var(--border);border-radius:4px;padding:14px 16px;margin-bottom:14px;background:#fcfdfe;}
.rubric-block h6{font-size:13.5px;font-weight:600;color:var(--dark-text);margin-bottom:8px;}
.level-grid{display:flex;flex-direction:column;gap:6px;}
.level-opt{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--body-text);padding:5px 8px;border-radius:3px;}
.level-opt input{margin-top:2px;}
.level-opt.sel{background:#eaf5fb;color:var(--primary);font-weight:600;}
.accordion-item{border:1px solid var(--border);border-radius:4px;margin-bottom:10px;overflow:hidden;}
.accordion-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer;background:#fafbfc;}
.accordion-head:hover{background:#f2f7fa;}
.accordion-body{padding:12px 14px;border-top:1px solid var(--border);display:none;}
.accordion-body.open{display:block;}
.accordion-item.expanded .accordion-body{display:block;}
.bar-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--dark-text);margin-bottom:6px;}
.bar-track{flex:1;height:14px;background:#eee;border-radius:8px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:8px;}
.step-track{display:flex;align-items:center;gap:0;margin-bottom:22px;}
.step-dot{width:26px;height:26px;border-radius:50%;background:#eee;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.step-dot.done{background:var(--success);color:#fff;}
.step-dot.active{background:var(--primary);color:#fff;}
.step-line{flex:1;height:2px;background:#eee;}
.step-line.done{background:var(--success);}
.member-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--border);border-radius:4px;margin-bottom:8px;font-size:13px;}
.section-divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
.small-muted{font-size:12px;color:var(--muted);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:800px){.grid-2{grid-template-columns:1fr;}}

/* ---------------- Utilities ---------------- */
let _id = 1000;
function uid(){ return _id++; }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}); }
function daysLeft(d){ const diff = Math.ceil((new Date(d) - new Date())/86400000); return diff; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function delay(ms){ return new Promise(r=>setTimeout(r,ms)); }
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function showToast(msg,type='ok'){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':type==='info'?' info':'');
  el.innerHTML = `${icon(type==='err'?'x':type==='info'?'info':'check',16)}<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(30px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function activeRoute(){ return state.route.split('?')[0]; }

function applySidebarCollapse(){
  document.getElementById('app-shell').classList.toggle('collapsed', state.sidebarCollapsed);
  const btn = document.getElementById('btn-sidebar-toggle');
  if(btn) btn.title = state.sidebarCollapsed ? 'Expand menu' : 'Collapse menu';
}

function renderSidebar(){
  const cfg = sidebarConfig(state.user.role);
  const cur = activeRoute();
  let html = '';
  cfg.forEach(entry=>{
    if(entry.section){ html += `<div class="nav-section">${esc(entry.section)}</div>`; return; }
    if(entry.type==='item'){
      html += `<button class="nav-item ${cur===entry.to?'active':''}" data-to="${entry.to}" title="${esc(entry.text)}">${icon(entry.icon)}<span>${entry.text}</span></button>`;
    } else if(entry.type==='menu'){
      const isOpen = state.openMenus[entry.key] ?? entry.items.some(i=>i.to===cur);
      html += `<button class="nav-menu-btn ${isOpen?'open':''}" data-menu="${entry.key}" title="${esc(entry.text)}">${icon(entry.icon)}<span>${entry.text}</span>${icon('chevRight',15)}<span class="chev" style="display:none"></span></button>`;
      html += `<div class="nav-sub ${isOpen?'open':''}" data-submenu="${entry.key}">`;
      entry.items.forEach(it=>{
        html += `<button class="nav-sub-item ${cur===it.to?'active':''}" data-to="${it.to}">${it.text}</button>`;
      });
      html += `</div>`;
    }
  });
  document.getElementById('sidebar').innerHTML = html;
  document.getElementById('sidebar').classList.toggle('mobile-open', state.mobileSidebar);
  const ov = document.getElementById('sidebar-overlay');
  ov.classList.toggle('show', state.mobileSidebar);
  ov.onclick = ()=>{ state.mobileSidebar=false; renderSidebar(); };

  document.querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>{
    state.mobileSidebar=false;
    navigate(b.dataset.to);
  }));
  document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>{
    const k = b.dataset.menu;
    if(state.sidebarCollapsed){ state.sidebarCollapsed=false; applySidebarCollapse(); }
    state.openMenus[k] = !(state.openMenus[k] ?? true);
    renderSidebar();
  }));
}

/* ---------------- Modal system ---------------- */
function openModal(html, opts={}){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay open" id="modal-overlay">
      <div class="modal-box" style="${opts.width?`width:${opts.width}`:''}">${html}</div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('click',(e)=>{
    if(e.target.id==='modal-overlay') closeModal();
  });
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openConfirm(title,msg,actionLabel,onConfirm,danger=true){
  openModal(`
    <div class="modal-box confirm-box" style="padding:26px 22px;text-align:center;">
      <div class="confirm-icon">${icon(danger?'warning':'info',22)}</div>
      <h5 style="margin-bottom:8px;">${esc(title)}</h5>
      <div class="small-muted" style="margin-bottom:20px;font-size:13px;">${esc(msg)}</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn btn-outline" id="cf-cancel">Cancel</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="cf-ok">${esc(actionLabel)}</button>
      </div>
    </div>`,{width:'380px'});
  document.getElementById('cf-cancel').onclick = closeModal;
  document.getElementById('cf-ok').onclick = ()=>{ closeModal(); onConfirm(); };
}

function openChangePasswordModal(){
  openModal(`
    <div class="modal-head"><h5>Change Password</h5><button class="close-x" id="cp-close">${icon('x',18)}</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Current Password</label><input class="form-control" type="password" id="cp-cur"></div>
      <div class="form-group"><label>New Password</label><input class="form-control" type="password" id="cp-new"></div>
      <div class="form-group"><label>Confirm New Password</label><input class="form-control" type="password" id="cp-conf"></div>
      <div id="cp-err" class="form-error-text" style="display:none;"></div>
    </div>
    <div class="modal-foot"><button class="btn btn-outline" id="cp-cancel">Cancel</button><button class="btn btn-primary" id="cp-save">Update Password</button></div>`);
  document.getElementById('cp-close').onclick = closeModal;
  document.getElementById('cp-cancel').onclick = closeModal;
  document.getElementById('cp-save').onclick = async ()=>{
    const cur = document.getElementById('cp-cur').value;
    const nw = document.getElementById('cp-new').value;
    const cf = document.getElementById('cp-conf').value;
    const err = document.getElementById('cp-err');
    err.style.display='none';
    if(cur !== state.user.password){ err.textContent='Current password is incorrect.'; err.style.display='block'; return; }
    if(nw.length < 6){ err.textContent='New password must be at least 6 characters.'; err.style.display='block'; return; }
    if(nw !== cf){ err.textContent='New password and confirmation do not match.'; err.style.display='block'; return; }
    const btn = document.getElementById('cp-save'); btn.disabled=true; btn.textContent='Updating...';
    await delay(600);
    state.user.password = nw;
    closeModal();
    showToast('Password updated successfully.');
  };
}

function skeletonRows(n=4){
  return `<div class="card"><div class="card-block">${Array.from({length:n}).map(()=>`<div class="skeleton skeleton-row"></div>`).join('')}</div></div>`;
}

/* ---------------- Generic search/filter table helper ---------------- */
function filterRows(rows, searchTerm, searchFields){
  if(!searchTerm) return rows;
  const t = searchTerm.toLowerCase();
  return rows.filter(r=> searchFields.some(f=> String(r[f]||'').toLowerCase().includes(t)));
}

function wireManagerDashboardScript(){
  setTimeout(()=>{
    document.querySelectorAll('[data-acc-toggle]').forEach(h=>{
      h.addEventListener('click',()=>{
        const id = h.dataset.accToggle;
        document.getElementById('acc-body-'+id).classList.toggle('open');
      });
    });
    document.querySelectorAll('[data-del-ann]').forEach(b=>b.addEventListener('click',()=>{
      const id = parseInt(b.dataset.delAnn);
      openConfirm('Remove announcement','This announcement will be permanently removed.','Remove',()=>{
        DB.announcements = DB.announcements.filter(a=>a.id!==id);
        document.getElementById('announcement-list').innerHTML = renderAnnouncementAccordion();
        wireManagerDashboardScript();
        showToast('Announcement removed.');
      });
    }));
    document.querySelectorAll('[data-edit-ann]').forEach(b=>b.addEventListener('click',()=>{
      openAnnouncementModal(parseInt(b.dataset.editAnn));
    }));
    document.querySelectorAll('[data-del-att]').forEach(b=>b.addEventListener('click',()=>{
      const id = parseInt(b.dataset.delAtt);
      openConfirm('Delete attachment','This file will be permanently deleted.','Delete',()=>{
        DB.attachments = DB.attachments.filter(a=>a.id!==id);
        document.getElementById('attachment-list').innerHTML = renderAttachmentList();
        wireManagerDashboardScript();
        showToast('Attachment deleted.');
      });
    }));
    document.querySelectorAll('[data-dl-att]').forEach(b=>b.addEventListener('click',()=>showToast('Downloading file... (mock)','info')));
    const nb = document.getElementById('btn-new-announcement');
    if(nb) nb.onclick = ()=>openAnnouncementModal(null);
  },0);
  return '';
}

      const btn=document.getElementById('am-upload-btn'); btn.disabled=true; btn.textContent='Uploading...';
      await delay(700);
      DB.attachments.push({id:uid(),name:title.replace(/\\s+/g,'_')+'.pdf',size:(rand(200,3000)/1000).toFixed(1)+' MB'});
      closeModal(); renderPageContent(); showToast('Attachment uploaded.');
    };
  }
  const submitBtn = document.getElementById('am-submit');
  if(submitBtn) submitBtn.onclick = async ()=>{
    const title = document.getElementById('am-title').value.trim();
    const content = document.getElementById('am-content').innerText.trim();

    if(!title || !content){ showToast('Please fill in title and content.','err'); return; }

    else { DB.announcements.unshift({id:uid(),title,content,date}); showToast('Announcement published.'); }
    closeModal(); renderPageContent();
  };
}

          :`<input class="form-control" name="${f.key}" required placeholder="Enter ${esc(f.label).toLowerCase()}">`}

      <button class="btn btn-primary" type="submit">${icon('plus',14)} Add ${label}</button>

function wireSimpleAddForm(dbKey,label,fields){
  setTimeout(()=>{
    const form = document.getElementById('simple-add-form');
    if(!form) return;
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(form);
      const rec = {id:uid(),deleted:false};
      fields.forEach(f=> rec[f.key]=fd.get(f.key));
      const btn = form.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Saving...';
      await delay(600);
      DB[dbKey].push(rec);
      btn.disabled=false; btn.innerHTML = `${icon('plus',14)} Add ${label}`;
      form.reset();
      showToast(label+' added successfully.');
    });
  },0);
  return '';
}

        DB.emailLog.push({to:email,subject:'Your PBL Portal Login Credentials',sentAt:todayISO()});
        btn.disabled=false; btn.innerHTML=`${icon('plus',14)} Submit`;

    const dz = document.getElementById('bulk-dropzone');

      dz.onclick = ()=>fi.click();

        e.preventDefault();
        dz.classList.toggle('drag', evt==='dragover');
      }));
      dz.addEventListener('drop', e=>{
        const f = e.dataTransfer.files[0];
        if(f) dz.innerHTML = `${icon('file',26)}<div><b>${esc(f.name)}</b></div><div class="small-muted">Ready to upload</div>`;
      });
      fi.onchange = ()=>{
        const f = fi.files[0];

      };

    const upBtn = document.getElementById('bulk-upload-btn');
    if(upBtn) upBtn.onclick = async ()=>{
      upBtn.disabled=true; upBtn.textContent='Uploading...';

        DB.emailLog.push({to:email,subject:'Your PBL Portal Login Credentials',sentAt:todayISO()});

/* ---- Generic CRUD List / Trash view (used by Students, Departments, Courses, Teachers) ---- */
function pageCrudView(dbKey, label, cols, trashMode){
  PAGE_STATE[dbKey+'_search'] = PAGE_STATE[dbKey+'_search'] || '';
  const search = PAGE_STATE[dbKey+'_search'];
  let rows = DB[dbKey].filter(r=> !!r.deleted === trashMode);
  const searchFields = cols.map(c=>c.k);
  rows = filterRows(rows, search, searchFields);

  const rowsHtml = rows.length ? rows.map(r=>`
    <tr>
      ${cols.map(c=>`<td>${esc(c.fmt?c.fmt(r[c.k]):r[c.k])}</td>`).join('')}
      <td>
        ${trashMode
          ? `<button class="btn btn-success btn-sm" data-recover="${r.id}">${icon('restore',13)} Recover</button>`
          : `<button class="btn btn-outline btn-sm" data-edit="${r.id}">${icon('edit',13)} Edit</button>
             <button class="btn btn-danger btn-sm" data-delete="${r.id}">${icon('trash',13)} Delete</button>`}
      </td>
    </tr>`).join('') : `<tr><td colspan="${cols.length+1}">${emptyState('No records found', trashMode?'Recycle bin is empty.':'No '+label.toLowerCase()+' match your search.', trashMode?'trash':'file')}</td></tr>`;

  return `
  ${pageHeader(label + (trashMode?' — Recycle Bin':''),['Manager',label,trashMode?'Recycle Bin':'View All'])}
  <div class="card b-primary"><div class="card-block">
    <div class="toolbar">
      <div class="search-input">${icon('search',15)}<input class="form-control" id="crud-search" placeholder="Search ${label.toLowerCase()}..." value="${esc(search)}"></div>
      <div class="small-muted">${rows.length} record${rows.length!==1?'s':''}</div>
    </div>
    <div class="table-wrap"><table class="dtable">
      <thead><tr>${cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th>Actions</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  </div></div>
  ${wireCrudView(dbKey,label,cols,trashMode)}`;
}
function wireCrudView(dbKey,label,cols,trashMode){
  setTimeout(()=>{
    const search = document.getElementById('crud-search');
    if(search){
      search.addEventListener('input', ()=>{ PAGE_STATE[dbKey+'_search']=search.value; renderCrudTableOnly(dbKey,label,cols,trashMode); });
    }
    document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{
      const id = parseInt(b.dataset.delete);
      openConfirm('Move to Recycle Bin',`This ${label.toLowerCase().slice(0,-1)} will be moved to the recycle bin. You can recover it later.`,'Delete',()=>{
        const rec = DB[dbKey].find(r=>r.id===id); rec.deleted=true;
        renderPageContent();
        showToast(label.slice(0,-1)+' moved to recycle bin.');
      });
    }));
    document.querySelectorAll('[data-recover]').forEach(b=>b.addEventListener('click',()=>{
      const id = parseInt(b.dataset.recover);
      openConfirm('Recover Record','This item will be restored from the recycle bin.','Recover',()=>{
        const rec = DB[dbKey].find(r=>r.id===id); rec.deleted=false;
        renderPageContent();
        showToast(label.slice(0,-1)+' recovered.');
      },false);
    }));
    document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
      openEditRecordModal(dbKey,label,cols,parseInt(b.dataset.edit));
    }));
  },0);
  return '';
}
function renderCrudTableOnly(dbKey,label,cols,trashMode){
  document.getElementById('content-wrap').innerHTML = pageCrudView(dbKey,label,cols,trashMode);
}

    await delay(700);
    targets.forEach(s=> DB.emailLog.push({to:s.email,subject:'Reminder: Create or Join a Project Group',sentAt:todayISO()}));

    showToast(`Reminder emails sent to ${targets.length} student(s).`);

function studentById(id){ return DB.students.find(s=>s.id===id); }
function deptOfCourse(courseName){ const c = DB.courses.find(c=>c.name===courseName); return c ? c.dept : null; }

function studentsWithoutGroup(deptFilter){

function renderSurveyQuestionBlocks(s){
  if(s.questions.length===0) return `<div class="small-muted" style="margin-bottom:14px;">No questions yet. Click "Add Another Question" to begin.</div>`;
  return s.questions.map((q,i)=>`
    <div class="rubric-block" data-qblock="${q.id}">

      <button class="btn btn-link" data-remove-q="${q.id}">${icon('trash',13)} Remove Question</button>
    </div>`).join('');
}
function wireSurveyQuestions(s){
  setTimeout(()=>{
    document.getElementById('sq-add').onclick = ()=>{
      s.questions.push({id:uid(),question:'',levels:{1:'',2:'',3:'',4:'',5:''}});
      document.getElementById('sq-list').innerHTML = renderSurveyQuestionBlocks(s);
      wireSurveyQuestions(s);
    };
    document.querySelectorAll('[data-remove-q]').forEach(b=>b.addEventListener('click',()=>{
      s.questions = s.questions.filter(q=>q.id!==parseInt(b.dataset.removeQ));
      document.getElementById('sq-list').innerHTML = renderSurveyQuestionBlocks(s);
      wireSurveyQuestions(s);
    }));
    document.getElementById('sq-save').onclick = async ()=>{
      document.querySelectorAll('[data-qtext]').forEach(inp=>{
        const q = s.questions.find(x=>x.id===parseInt(inp.dataset.qtext)); if(q) q.question = inp.value;
      });
      document.querySelectorAll('[data-qlevel]').forEach(inp=>{
        const [qid,lv] = inp.dataset.qlevel.split('|');
        const q = s.questions.find(x=>x.id===parseInt(qid)); if(q) q.levels[lv]=inp.value;
      });
      const btn=document.getElementById('sq-save'); btn.disabled=true; btn.textContent='Saving...';
      await delay(600);
      btn.disabled=false; btn.textContent='Save Questions';
      showToast('Survey questions saved.');
      navigate('#/manager/survey/view');
    };
  },0);
}

function pageManageRubrics(iterId){
  const it = DB.iterations.find(i=>i.id===iterId);
  if(!it) return emptyState('Iteration not found','It may have been removed.');
  const totalWeight = it.rubrics.reduce((a,r)=>a+Number(r.weight||0),0);
  return `${pageHeader('Rubrics for: '+it.title,['Manager','Iterations','Rubrics'])}
  <div class="card b-primary"><div class="card-block">
    <div id="rubric-list">${renderRubricBlocks(it)}</div>
    <button class="btn btn-outline" id="rb-add">${icon('plus',14)} Add New Criterion</button>
    <div class="section-divider"></div>
    <div class="small-muted" id="rb-total" style="margin-bottom:12px;font-weight:600;color:${totalWeight===100?'var(--success)':'var(--danger)'}">Total Weight: ${totalWeight}% ${totalWeight===100?'✓':'(must equal 100%)'}</div>
    <button class="btn btn-primary" id="rb-save">Save Rubrics</button>
  </div></div>
  ${wireRubricPage(it)}`;
}
function renderRubricBlocks(it){
  if(it.rubrics.length===0) return `<div class="small-muted" style="margin-bottom:14px;">No criteria yet. Add your first criterion below.</div>`;
  return it.rubrics.map((r,i)=>`
    <div class="rubric-block">
      <div class="form-row">
        <div class="form-group" style="flex:3;"><label>Criterion ${i+1}: Name</label><input class="form-control" data-rname="${r.id}" value="${esc(r.question)}"></div>
        <div class="form-group" style="flex:1;"><label>Weight %</label><input class="form-control" type="number" data-rweight="${r.id}" value="${r.weight}"></div>
      </div>
      ${[0,1,2,3,4,5].map(lv=>`<div class="form-group" style="margin-bottom:6px;"><label style="display:inline;">Level ${lv}:</label> <input class="form-control" style="display:inline-block;width:calc(100% - 70px);margin-left:6px;" data-rlevel="${r.id}|${lv}" value="${esc(r.levels[lv]||'')}"></div>`).join('')}
      <button class="btn btn-link" data-remove-r="${r.id}">${icon('trash',13)} Remove Criterion</button>
    </div>`).join('');
}
function wireRubricPage(it){
  setTimeout(()=>{
    document.getElementById('rb-add').onclick = ()=>{
      it.rubrics.push({id:uid(),question:'',weight:0,levels:{0:'',1:'',2:'',3:'',4:'',5:''}});
      document.getElementById('rubric-list').innerHTML = renderRubricBlocks(it);
      wireRubricPage(it);
    };
    document.querySelectorAll('[data-remove-r]').forEach(b=>b.addEventListener('click',()=>{
      it.rubrics = it.rubrics.filter(r=>r.id!==parseInt(b.dataset.removeR));
      document.getElementById('rubric-list').innerHTML = renderRubricBlocks(it);
      wireRubricPage(it);
    }));
    document.getElementById('rb-save').onclick = async ()=>{
      document.querySelectorAll('[data-rname]').forEach(inp=>{const r=it.rubrics.find(x=>x.id===parseInt(inp.dataset.rname)); if(r) r.question=inp.value;});
      document.querySelectorAll('[data-rweight]').forEach(inp=>{const r=it.rubrics.find(x=>x.id===parseInt(inp.dataset.rweight)); if(r) r.weight=Number(inp.value||0);});
      document.querySelectorAll('[data-rlevel]').forEach(inp=>{const [rid,lv]=inp.dataset.rlevel.split('|'); const r=it.rubrics.find(x=>x.id===parseInt(rid)); if(r) r.levels[lv]=inp.value;});
      const totalWeight = it.rubrics.reduce((a,r)=>a+Number(r.weight||0),0);
      if(it.rubrics.length && totalWeight!==100){ showToast('Total weight must equal 100% before saving.','err'); renderPageContent(); return; }
      const btn=document.getElementById('rb-save'); btn.disabled=true; btn.textContent='Saving...';
      await delay(600);
      showToast('Rubrics saved successfully.');
      navigate('#/manager/iterations/manage');
    };
  },0);
}

function pageEvaluationSheet(iterId,groupId){
  const it = DB.iterations.find(i=>i.id===iterId);
  const g = DB.groups.find(x=>x.id===groupId);
  const existing = DB.evaluations.find(e=>e.iterationId===iterId && e.groupId===groupId);
  return `${pageHeader('Evaluating: '+g.name+' — '+it.title,['Evaluator','Evaluate',it.title])}
  <div class="card b-primary"><div class="card-block" style="max-width:640px;">
    <div class="small-muted">Group Members: ${g.members.map(m=>esc(studentById(m).name)).join(', ')}</div>
    <div class="section-divider"></div>
    <form id="ev-form">
      ${it.rubrics.map(r=>`<div class="rubric-block"><h6>${esc(r.question)} <span class="badge badge-info">${r.weight}%</span></h6>
        <div class="level-grid" data-evgroup="${r.id}">${[0,1,2,3,4,5].map(lv=>`<label class="level-opt ${existing&&existing.scores[r.id]===lv?'sel':''}"><input type="radio" name="c_${r.id}" value="${lv}" ${existing&&existing.scores[r.id]===lv?'checked':''} ${existing?'disabled':''} required> ${lv} — ${esc(r.levels[lv])}</label>`).join('')}</div>
      </div>`).join('')}
      <div class="small-muted">Total Score: <b id="ev-total" style="color:var(--dark-text);">${existing?existing.total+'%':'—'}</b></div>
      <div class="form-group" style="margin-top:14px;"><label>Comments (optional)</label><textarea class="form-control" rows="3" id="ev-comments" ${existing?'disabled':''}>${existing?esc(existing.comments):''}</textarea></div>
      ${existing?`<div class="locked-banner">${icon('lock',15)} Evaluation already submitted.</div>`:`<button class="btn btn-primary" type="submit">Save Evaluation</button>`}
    </form>
  </div></div>
  ${(function(){setTimeout(()=>{
    document.querySelectorAll('[data-evgroup] input').forEach(inp=>inp.addEventListener('change', computeTotal));
    function computeTotal(){
      let total=0, maxTotal=0;
      it.rubrics.forEach(r=>{
        const sel = document.querySelector(`input[name="c_${r.id}"]:checked`);
        if(sel){ total += (parseInt(sel.value)/5)*r.weight; }
        maxTotal += r.weight;
      });
      const totalEl = document.getElementById('ev-total');
      if(totalEl) totalEl.textContent = Math.round(total)+'%';
      document.querySelectorAll('[data-evgroup]').forEach(gr=>{
        gr.querySelectorAll('.level-opt').forEach(o=>o.classList.toggle('sel', o.querySelector('input').checked));
      });
    }
    const form = document.getElementById('ev-form');
    if(form && !existing) form.addEventListener('submit', async e=>{
      e.preventDefault();
      let total=0;
      const scores={};
      it.rubrics.forEach(r=>{
        const sel = document.querySelector(`input[name="c_${r.id}"]:checked`);
        scores[r.id]=parseInt(sel.value);
        total += (scores[r.id]/5)*r.weight;
      });
      const btn = form.querySelector('button'); btn.disabled=true; btn.textContent='Saving...';
      await delay(600);
      DB.evaluations.push({id:uid(),iterationId:iterId,groupId,scores,total:Math.round(total),comments:document.getElementById('ev-comments').value,evaluatorId:state.user.email});
      showToast('Evaluation saved.');
      navigate('#/evaluator/groups');
    });
  },0);return '';})()}`;
}

/* ---- HOD / HODI&C: department-scoped groups, charts, Save as PDF ---- */
function pageHodDashboard(role){
  const dept = state.user.dept;
  const groups = DB.groups.filter(g=>groupDept(g)===dept);
  const students = DB.students.filter(s=>!s.deleted && s.dept===dept);
  const noGroup = studentsWithoutGroup(dept);
  const approved = groups.filter(g=>g.status==='approved').length;
  const pending = groups.filter(g=>g.status==='pending').length;
  const sections = [...new Set(students.map(s=>s.section))];
  const maxCount = Math.max(1, approved, pending, ...sections.map(sec=>groups.filter(g=>g.section===sec).length));

  return `
  ${pageHeader('Department Dashboard',['Home','Dashboard'])}
  <div class="alert alert-info">${icon('info',16)} You have read-only oversight access as ${roleLabel(role)} — <b>${esc(dept)} Department</b>.</div>

    ${statCard(groups.length,'FYP Groups in Department','group')}

    ${statCard(noGroup.length,'Students Without a Group','users','info')}

  <div class="grid-2">
    <div class="card b-primary"><div class="card-block">
      <div class="card-title">Groups by Status</div>
      <div class="bar-row"><span style="width:90px;">Approved</span><div class="bar-track"><div class="bar-fill" style="width:${approved/maxCount*100}%;background:var(--success);"></div></div><span>${approved}</span></div>
      <div class="bar-row"><span style="width:90px;">Pending</span><div class="bar-track"><div class="bar-fill" style="width:${pending/maxCount*100}%;background:var(--warning);"></div></div><span>${pending}</span></div>
    </div></div>
    <div class="card b-info"><div class="card-block">
      <div class="card-title">Groups by Section</div>
      ${sections.length? sections.map(sec=>{const c=groups.filter(g=>g.section===sec).length; return `<div class="bar-row"><span style="width:90px;">Section ${esc(sec)}</span><div class="bar-track"><div class="bar-fill" style="width:${c/maxCount*100}%;"></div></div><span>${c}</span></div>`;}).join('') : emptyState('No sections yet','','group')}

  </div>
  <div class="card b-primary"><div class="card-block">
    <div class="card-title">All FYP Groups — ${esc(dept)} Department <button class="btn btn-outline btn-sm no-print" id="hod-pdf-btn">${icon('download',13)} Save as PDF</button></div>
    <div class="table-wrap"><table class="dtable">
      <thead><tr><th>Group</th><th>Project Title</th><th>Section</th><th>Members</th><th>Status</th></tr></thead>
      <tbody>${groups.length?groups.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.projectTitle)}</td><td>${esc(g.section)}</td><td>${g.members.length}/${g.max}</td><td>${statusBadge(g.status)}</td></tr>`).join(''):`<tr><td colspan="5">${emptyState('No groups yet','No FYP groups have been formed in this department.','group')}</td></tr>`}</tbody>
    </table></div>
  </div></div>
  ${wirePdfPrintButton('hod-pdf-btn')}`;
}

}

/* ---------------- Master render ---------------- */
function render(){
  if(!state.user){
    document.getElementById('app-shell').style.display='none';
    document.getElementById('login-root').style.display='flex';
    renderLogin();
    return;
  }
  document.getElementById('login-root').style.display='none';
  document.getElementById('app-shell').style.display='block';
  renderNavbar();
  renderSidebar();
  applySidebarCollapse();
  renderPageContent();
}

/* ---------------- Init ---------------- */
window.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    document.getElementById('preloader').classList.add('hide');
    setTimeout(()=>document.getElementById('preloader').remove(),450);
  },500);
  if(!location.hash) location.hash = '#/login';
  state.route = location.hash;
  render();
});
window.addEventListener('resize', ()=>{
  if(window.innerWidth>900 && state.mobileSidebar){ state.mobileSidebar=false; renderSidebar(); }
});
window.addEventListener('keydown', e=>{
  if(e.key==='Escape' && state.mobileSidebar){ state.mobileSidebar=false; renderSidebar(); }
});
</script>
</body>
</html>
