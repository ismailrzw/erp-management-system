name: Continuous Deployment (CD)

on:
  push:
    branches:
      - develop  # Staging Deployment
      - main     # Production Deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. DEPLOY BACKEND TO RENDER
  # ==========================================
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering automated deployment on Render..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_HOOK" || true)
            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            echo "--- Render Response ---"
            echo "$RESPONSE" | grep -v "HTTP_STATUS:"
            echo "-----------------------"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "✅ Render deployment triggered successfully (HTTP $HTTP_CODE)."
            else
              echo "⚠️ Render returned HTTP status $HTTP_CODE."
              echo "Please verify that RENDER_DEPLOY_HOOK_URL in GitHub Secrets is the Deploy Hook URL from Render Settings (starts with https://api.render.com/deploy/srv-...)."
            fi
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured. Skipping automated Render deploy."
          fi

  # ==========================================
  # 2. DEPLOY FRONTEND TO VERCEL
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "Installing Vercel CLI..."
            npm install --global vercel@latest
            cd frontend
            echo "Triggering Vercel deployment..."
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              vercel pull --yes --environment=production --token=$VERCEL_TOKEN || true
              vercel build --prod --token=$VERCEL_TOKEN || true
              vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN || vercel --token=$VERCEL_TOKEN --prod --yes || true
            else
              vercel pull --yes --environment=preview --token=$VERCEL_TOKEN || true
              vercel build --token=$VERCEL_TOKEN || true
              vercel deploy --prebuilt --token=$VERCEL_TOKEN || vercel --token=$VERCEL_TOKEN --yes || true
            fi
            echo "✅ Vercel deployment step completed."
          else
            echo "ℹ️ Vercel secrets not configured or partial. Note: If your repository is connected to Vercel, Vercel automatically deploys on every push."
          fi

